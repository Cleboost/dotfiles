# #######################################################################################
# 📏  WINDOW & LAYER RULES
# Equivalent to Hyprland's rules/rules.conf & rules/specialwork.conf
# #######################################################################################

# ── Transparency & blur (paired — blur only visible where opacity < 1) ───────
# Umbriel docs: blur engine is global, but blur renders only on transparent surfaces.
# Hyprland tied blur to opacity rules; do NOT opt-in blur on every window.
[[window_rule]]
match.app_id = "^(kitty|org.gnome.Nautilus|[Ss]potify|fastpotify|discord|dev.zed.Zed|rustdesk|cursor|claude|dev.noctalia.Noctalia|dev.noctalia.Noctalia.Settings|dev.faetalize.waytator)$"
opacity = 0.85
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^(firefox)$"
opacity = 0.95
blur = true
blur_optimized = true

# ── File Chooser & Dialogs Floating ─────────────────────────────────────────
[[window_rule]]
match.title = "^(Open File|Select a File|Open Folder|Save As)(.*)$"
default_floating = true

# ── Bitwarden Extension Popup ───────────────────────────────────────────────
[[window_rule]]
match.app_id = "^(chrome-nngceckbapebfimnlniiiahkandclblb-Default)$"
default_floating = true
default_size = [400, 600]

[[window_rule]]
match.app_id = "^(dev.noctalia.Noctalia.Settings|dev.noctalia.Noctalia)$"
default_floating = true
default_size = [1020, 900]

[[window_rule]]
match.app_id = "^(dev.faetalize.waytator)$"
default_floating = true

# ── System Apps ─────────────────────────────────────────────────────────────
[[window_rule]]
match.app_id = "^(pavucontrol)$"
default_floating = true
default_width = 0.45
default_height = 0.45

# ── Tiling Workarounds ──────────────────────────────────────────────────────
[[window_rule]]
match.app_id = "^dev[.]warp[.]Warp$"
default_floating = false

# ── Gaming & Tearing Opt-in ─────────────────────────────────────────────────
# ECMAScript regex is case-sensitive: title has "Minecraft", not "minecraft".
# vrr = fullscreen matches Hyprland monitor vrr,1 (not always — menus feel laggy).
[[window_rule]]
match.title = ".*[Mm]inecraft.*"
tearing = true
vrr = "fullscreen"

[[window_rule]]
match.title = ".*[.]exe"
tearing = true
vrr = "fullscreen"

[[window_rule]]
match.app_id = "^(steam_app.*|cs2)$"
tearing = true
vrr = "fullscreen"

[[window_rule]]
match.content_type = "game"
tearing = true
vrr = "fullscreen"

# ── Special Scratchpads (Comm & Music) ──────────────────────────────────────
# On Hyprland, special workspaces had gapsout: 50 (~92% width & ~90% height)
[[window_rule]]
match.app_id = "^(discord)$"
default_scratchpad = "comm"
default_floating = false
default_focused = false

[[window_rule]]
match.app_id = "^([Ss]potify|fastpotify)$"
default_scratchpad = "music"
default_floating = false
default_focused = false

# ── Layer Rules (Noctalia Shell UI blur) ─────────────────────────────────────
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = true
