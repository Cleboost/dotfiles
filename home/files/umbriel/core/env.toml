# #######################################################################################
#   ENVIRONMENT VARIABLES & DRIVER SETTINGS
# #######################################################################################

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
XDG_DATA_DIRS = "/home/cleboost/.local/share:/etc/profiles/per-user/cleboost/share:/run/current-system/sw/share:/usr/share"
TERMINAL = "kitty -1"
NAUTILUS_4_EXTENSION_DIR = "/run/current-system/sw/lib/nautilus/extensions-4"

# Toolkit Themes (QT/GTK)
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_STYLE_OVERRIDE = "kvantum"
GTK_ICON_THEME = "WhiteSur-dark"
GTK_USE_PORTAL = "0"
GSK_RENDERER = "gl"

# Cursor
XCURSOR_THEME = "cleboost-cursor"
XCURSOR_SIZE = "18"

# Nvidia RTX GPU (also in home.sessionVariables + systemd user umbriel.service)
# Hyprland sets AQ_DRM_DEVICES=card0:card1 (NVIDIA first) in hyprland.conf — wlroots/Umbriel equivalent:
WLR_DRM_DEVICES = "/dev/dri/card0:/dev/dri/card1"
LIBVA_DRIVER_NAME = "nvidia"
__GLX_VENDOR_LIBRARY_NAME = "nvidia"
GBM_BACKEND = "nvidia-drm"
__GL_GSYNC_ALLOWED = "1"
__GL_MaxFramesAllowed = "1"
NVD_BACKEND = "direct"

# Gaming
MANGOHUD = "1"
MANGOHUD_DLSYM = "1"
