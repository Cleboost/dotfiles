# #######################################################################################
#   ENVIRONMENT VARIABLES
# #######################################################################################

##! Wayland & Ozone
env = ELECTRON_OZONE_PLATFORM_HINT, auto

##! XDG & Applications
env = XDG_DATA_DIRS, /home/cleboost/.local/share:/etc/profiles/per-user/cleboost/share:/run/current-system/sw/share:/usr/share
env = TERMINAL, kitty -1
env = NAUTILUS_4_EXTENSION_DIR, /run/current-system/sw/lib/nautilus/extensions-4

##! Toolkit Themes (QT/GTK)
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_STYLE_OVERRIDE, kvantum
env = GTK_ICON_THEME, WhiteSur-dark
env = GTK_USE_PORTAL, 0
env = GSK_RENDERER, gl

##! Cursor
env = XCURSOR_THEME, cleboost-cursor
env = XCURSOR_SIZE, 18
env = HYPRCURSOR_THEME, cleboost-cursor
env = HYPRCURSOR_SIZE, 18

##! Nvidia Specific (Primary RTX GPU)
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = GBM_BACKEND, nvidia-drm
env = __GL_GSYNC_ALLOWED, 1
env = NVD_BACKEND, direct

##! Gaming
env = MANGOHUD, 1
env = MANGOHUD_DLSYM, 1
