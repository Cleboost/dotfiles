# #######################################################################################
#   PERSONAL OVERRIDES — loaded last, overrides everything including noctalia
# #######################################################################################

# Load plugins (e.g., dynamic-cursors) on startup
exec-once = hyprpm reload -n
exec-once = hyprctl setcursor cleboost-cursor 24

##! Glass-style borders — uniform semi-transparent, diagonal shimmer
general {
    border_size = 6
    col.active_border = rgba(ffffff66) rgba(ffffff33) 135deg
    col.inactive_border = rgba(ffffff22) rgba(ffffff11) 135deg
}

plugin {
    dynamic-cursors {
        enabled = true
        mode = stretch # options: none, tilt, rotate, stretch

        shake {
            enabled = true
            nearest = false
            base = 1.0
            speed = 4.0
            influence = 2.0
            limit = 3.0
            threshold = 3.0
            timeout = 1000
        }

        hyprcursor {
            enabled = true
            resolution = 256
            fallback = default
        }
    }
}

# ── Smooth animations without overshoot / bounce
animations {
    enabled = true

    # Smooth curve without overshoot — Y stays in [0, 1]
    bezier = easeOutQuint, 0.22, 1, 0.36, 1

    # Window movements
    animation = windowsMove, 1, 4.0, easeOutQuint, slide

    # Window opening: scales from 5% → 100%, without bounce
    animation = windowsIn,  1, 3.5, easeOutQuint, popin 5%

    # Window closing: scales down from 100% → 5%, without bounce
    animation = windowsOut, 1, 3.5, easeOutQuint, popin 5%

    # Workspaces
    animation = workspaces, 1, 4.5, easeOutQuint, slide
}

# ── Mouse Button Overrides (Enforced in Noctalia's global submap)
submap = global

# 1. Clean up potentially blocked legacy mouse binds
unbind = , mouse:275
unbind = , mouse:276
unbind = SUPER, mouse:275
unbind = SUPER, mouse:276
unbind = SUPER, mouse_up
unbind = SUPER, mouse_down
unbind = , mouse_up
unbind = , mouse_down

# Scroll wheel with SUPER to switch workspaces
binde = SUPER, mouse_up, workspace, e-1
binde = SUPER, mouse_down, workspace, e+1

# Always return to Noctalia's global submap
submap = global

