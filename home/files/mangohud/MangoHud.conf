### MangoHud Configuration for Gaming & 1% Low monitoring

# FPS & 1% low metrics display (essential for framerate smoothness tracking)
fps
fps_metrics=avg,0.01
frametime
frame_timing=1

# GPU & CPU metrics
gpu_stats
gpu_temp
gpu_core_clock
gpu_power

cpu_stats
cpu_temp
cpu_mhz

# Memory
vram
ram

# Visual options
position=top-left
round_corners=10
background_alpha=0.6
font_size=20

# In-game keybindings
# Right Shift + F12: Toggle MangoHud display
toggle_hud=Shift_R+F12
# Right Shift + F11: Cycle HUD position (corners)
toggle_hud_position=Shift_R+F11
# Right Shift + F9: Reset 1% low counters
reset_fps_metrics=Shift_R+F9
